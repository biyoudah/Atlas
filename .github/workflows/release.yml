name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build & Package Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: win-x64
            os: windows-latest
            artifact_name: atlas-win-x64.zip
            binary_name: Atlas.exe
          - target: linux-x64
            os: ubuntu-latest
            artifact_name: atlas-linux-x64.tar.gz
            binary_name: Atlas
          - target: osx-x64
            os: macos-latest
            artifact_name: atlas-osx-x64.tar.gz
            binary_name: Atlas
          - target: osx-arm64
            os: macos-latest
            artifact_name: atlas-osx-arm64.tar.gz
            binary_name: Atlas

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file self-contained binary
        run: >
          dotnet publish src/Atlas/Atlas.csproj
          --configuration Release
          --runtime ${{ matrix.target }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ./publish

      - name: Copy auxiliary resources (docs/index.html & mapping packs)
        shell: bash
        run: |
          mkdir -p ./publish/docs
          cp docs/index.html ./publish/docs/ 2>/dev/null || true

      - name: Archive binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Archive binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C ./publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd ./artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/*/*.zip
            ./artifacts/*/*.tar.gz
            ./artifacts/SHA256SUMS.txt
