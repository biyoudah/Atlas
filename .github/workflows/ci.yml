name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Atlas.slnx

    - name: Verify code formatting
      run: dotnet format Atlas.slnx --verify-no-changes

    - name: Build solution (Release)
      run: dotnet build Atlas.slnx --configuration Release --no-restore

    - name: Run automated test suite
      run: dotnet test Atlas.slnx --configuration Release --no-build --verbosity normal
